server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths like /tasks fall back to index.html so React Router handles them
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change, so let the browser cache them
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
